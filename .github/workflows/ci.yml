name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ----------------------------------------
  # 1. BACKEND JOB
  # ----------------------------------------
  backend-test:
    runs-on: ubuntu-latest

    env:
      SECRET_KEY: ci-test-secret-key-long-enough-for-jwt-32chars
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      CSRF_TRUSTED_ORIGINS: http://localhost:3000

    defaults:
      run:
        working-directory: react-django-FullStackwithAuth-main/backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 . --max-line-length=120 --exclude=migrations,venv --ignore=E302

      - name: Run migrations
        run: python manage.py migrate

      - name: Run tests
        run: pytest

  # ----------------------------------------
  # 2. FRONTEND JOB
  # ----------------------------------------
  frontend-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: react-django-FullStackwithAuth-main/frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        run: npm run build
